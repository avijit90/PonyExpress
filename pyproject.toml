[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ponyexpress"
version = "0.1.0"
description = "Verified browser-readable Git bundle capsules."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "PonyExpress contributors"}]

[project.scripts]
ponyexpress = "ponyexpress.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
